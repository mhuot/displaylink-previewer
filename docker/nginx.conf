server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Files are decoded in the visitor's browser; nothing is ever uploaded here.
    client_max_body_size 1k;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Optional password: mount a folder at /etc/nginx/auth holding an auth.conf
    # (auth_basic + auth_basic_user_file) and its htpasswd file. Empty folder: no password.
    include /etc/nginx/auth/*.conf;

    location = /healthz {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Optional preloaded library: mount a folder at /usr/share/nginx/library with an
    # index.json from `serve.py --write-index`. Without one, /library/ is a quick 404.
    location /library/ {
        alias /usr/share/nginx/library/;
        try_files $uri =404;
        default_type application/octet-stream;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' blob: data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
